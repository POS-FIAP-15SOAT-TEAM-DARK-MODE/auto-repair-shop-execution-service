apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# AWS Academy Learner Lab overlay: no Ingress/LoadBalancer and no External Secrets (no IRSA).
# The app Secret is created by the pipeline from Secrets Manager.
resources:
  - ../../base

components:
  - ../../components/observability

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: execution-service-config
