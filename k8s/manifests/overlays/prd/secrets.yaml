# External Secrets Operator materialises auto-repair-shop-prd/execution (all keys) into the Secret
# execution-service-secrets. Keys are the environment variable names.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager-execution
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-execution
    kind: SecretStore
  target:
    name: execution-service-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: auto-repair-shop-prd/execution
