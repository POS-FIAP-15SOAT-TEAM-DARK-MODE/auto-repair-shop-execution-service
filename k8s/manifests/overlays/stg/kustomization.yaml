apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

resources:
  - ../../base
  - secrets.yaml

components:
  - ../../components/observability

images:
  - name: auto-repair-shop-execution-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/auto-repair-shop-execution-service
    newTag: latest

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: execution-service-config
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: execution-service
