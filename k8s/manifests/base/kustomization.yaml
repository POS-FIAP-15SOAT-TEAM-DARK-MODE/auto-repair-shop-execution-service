apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# execution-service workload only. Networking is owned by infra-k8s; the database (RDS) by infra-db.
resources:
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - migrate-job.yaml

images:
  - name: auto-repair-shop-execution-service
    newTag: dev
