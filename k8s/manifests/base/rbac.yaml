apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-service
---
# Grants only what the wait-for-migrations initContainer needs: read the migration Job status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: execution-service-wait-migrations
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: execution-service-wait-migrations
subjects:
  - kind: ServiceAccount
    name: execution-service
roleRef:
  kind: Role
  name: execution-service-wait-migrations
  apiGroup: rbac.authorization.k8s.io
